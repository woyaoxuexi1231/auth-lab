# ============================================================
# Session 认证模块 — 开发环境配置
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://@mysql.host@:@mysql.port@/security_lab_session?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: @mysql.username@
    password: @mysql.password@
    driver-class-name: @mysql.driver@
  data:
    redis:
      host: @redis.host@
      port: @redis.port@
      password: @redis.password@

