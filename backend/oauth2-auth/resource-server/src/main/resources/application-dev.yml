# ============================================================
# OAuth2 资源服务器 — 开发环境配置
# ============================================================
spring:
  cloud:
    nacos:
      discovery:
        server-addr: @nacos.host@:@nacos.port@
        ip: @nacos.ip@
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: @oauth2.base-url@

